name: Build Morphe bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "patches/**"
      - "scripts/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew*"

permissions:
  contents: read
  packages: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Morphe bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:generatePatchesList
          ./gradlew :patches:buildAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: hushgram-morphe-bundle
          path: patches/build/release/*
          if-no-files-found: error
