name: Build Morphe bundle

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this verified bundle as a public GitHub Release
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "patches/**"
      - "scripts/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew*"

permissions:
  contents: read
  packages: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Morphe bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:generatePatchesList
          ./gradlew :patches:buildAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: hushgram-morphe-bundle
          path: patches/build/release/*
          if-no-files-found: error

  release:
    if: ${{ inputs.publish }}
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hushgram-morphe-bundle
          path: release
      - name: Publish verified bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk -F ' = ' '$1 == "version" { print $2 }' gradle.properties)"
          gh release create "v${version}-tw" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Traditional Chinese bundle ${version}" --notes "Traditional Chinese (Taiwan) localization build for Morphe."
